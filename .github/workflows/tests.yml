name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 skills/promptgremlin/scripts/run_tests.py
      - name: Manifest sanity
        run: |
          python3 - <<'PY'
          import json
          with open(".claude-plugin/plugin.json") as f:
              plugin = json.load(f)
          with open(".claude-plugin/marketplace.json") as f:
              market = json.load(f)
          for key in ("name", "version", "description"):
              assert plugin.get(key), f"plugin.json: missing {key}"
          for key in ("name", "description"):
              assert market.get(key), f"marketplace.json: missing {key}"
          assert market.get("plugins"), "marketplace.json: no plugins"
          for entry in market["plugins"]:
              for key in ("name", "description"):
                  assert entry.get(key), f"marketplace.json plugin entry: missing {key}"
          print("manifests ok")
          PY
